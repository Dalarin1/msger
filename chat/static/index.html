<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oleg Chat</title>
<link rel="stylesheet" href="static/common.css">
<link rel="stylesheet" href="static/index.css">
</head>
<body>

<nav>
    <div class="logo">Oleg Chat</div>
    <a href="/" class="active">Главная</a>
    <a href="/chat">Мои чаты</a>
    <a href="/profile">Профиль <span id="my-name"></span></a>
</nav>

<main>
    <div class="topbar">
        Общий чат
        <span id="status">connecting...</span>
    </div>

    <div id="messages"></div>
    <div id="pendingFiles"></div>
    <div id="uploadStatus"></div>

    <div id="inputBar">
        <button id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Прикрепить файл">📎</button>
        <button id="recordVM" title="Записать ГС">🎤</button>
        <input type="file" id="fileInput" multiple onchange="handleFileSelect(event)">
        <input id="textInput" placeholder="Сообщение...">
        <button id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>
</main>

<div id="authOverlay">
    <div id="authCard">
        <button class="close-btn" onclick="hideAuthModal()">✕</button>
        <h2>Нужен аккаунт</h2>
        <p>Чтобы писать в чат, войди или создай аккаунт — это займёт секунду.</p>
        <a class="auth-btn primary" href="/login">Войти</a>
        <a class="auth-btn secondary" href="/login#register">Зарегистрироваться</a>
    </div>
</div>
<script src="static/common.js"></script>
<script src="static/index.js"></script>
</body>
</html>
