<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oleg Chat</title>
<link rel="stylesheet" href="static/common.css">
<link rel="stylesheet" href="static/index.css">
</head>
<body>

<nav>
    <div class="logo">Oleg Chat</div>
    <a href="/" class="active">Главная</a>
    <a href="/chat">Мои чаты</a>
    <a href="/profile">Профиль <span id="my-name"></span></a>
</nav>

<main>
    <div class="topbar">
        Общий чат
        <span id="status">connecting...</span>
    </div>

    <div id="messages"></div>
    <div id="pendingFiles"></div>
    <div id="uploadStatus"></div>

    <div id="inputBar">
        <button id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Прикрепить файл">📎</button>
        <input type="file" id="fileInput" multiple onchange="handleFileSelect(event)">
        <input id="textInput" placeholder="Сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
</main>

<div id="authOverlay">
    <div id="authCard">
        <button class="close-btn" onclick="hideAuthModal()">✕</button>
        <h2>Нужен аккаунт</h2>
        <p>Чтобы писать в чат, войди или создай аккаунт — это займёт секунду.</p>
        <a class="auth-btn primary" href="/login">Войти</a>
        <a class="auth-btn secondary" href="/login#register">Зарегистрироваться</a>
    </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const statusEl   = document.getElementById("status");
const input      = document.getElementById("textInput");
const overlay    = document.getElementById("authOverlay");

let accessToken = null;
let pendingAttachments = []; // [{url, mime, original_name}]

function isLoggedIn() { return accessToken !== null; }

async function refreshAccessToken() {
    const res = await fetch("/auth/refresh", { method: "POST", credentials: "include" });
    if (!res.ok) return false;
    const data = await res.json();
    accessToken = data.access_token;

    var profile_name = "";
    if (data.name.length > 15){
        profile_name = data.name.substring(0, 12) + "...";
    } else {
        profile_name = data.name;
    }
    document.getElementById("my-name").textContent = profile_name;

    return true;
}

async function apiFetch(url, options = {}) {
    if (!accessToken) {
        const ok = await refreshAccessToken();
        if (!ok) return null;
    }
    const doReq = () => fetch(url, {
        ...options, credentials: "include",
        headers: { ...options.headers, "Authorization": `Bearer ${accessToken}` },
    });
    let res = await doReq();
    if (res.status === 401) {
        const ok = await refreshAccessToken();
        if (!ok) return null;
        res = await doReq();
    }
    return res;
}

function showAuthModal() { overlay.classList.add("visible"); }
function hideAuthModal()  { overlay.classList.remove("visible"); }
overlay.addEventListener("click", e => { if (e.target === overlay) hideAuthModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideAuthModal(); });

function ensureLoggedIn() {
    if (isLoggedIn()) return true;
    showAuthModal();
    return false;
}

function attachmentIcon(mime) {
    if (!mime) return "📄";
    if (mime.startsWith("image/")) return "🖼";
    if (mime.startsWith("audio/")) return "🎵";
    if (mime.startsWith("video/")) return "🎬";
    return "📄";
}

function renderCommonAttachementLink(url, icon, label) {
    return `
        <a class="attachment-file"
           href="${escapeHtml(url)}"
           target="_blank"
           rel="noopener">
            <span>${icon}</span>
            <span>${label}</span>
        </a>
    `;
}

function renderImageOrVideoAttachements(att) {
    const url = escapeHtml(att.url);

    if (att.mime?.startsWith("image/")) {
        return `
            <a href="${url}" target="_blank">
                <img
                    class="attachment-image"
                    src="${url}"
                    loading="lazy"
                    alt="">
            </a>
        `;
    }

    if (att.mime?.startsWith("video/")) {
        return `
            <video
                class="attachment-video"
                controls
                preload="metadata">
                <source src="${url}" type="${att.mime}">
            </video>
        `;
    }

    return null;
}

function renderAttachments(attachments) {
    if (!attachments?.length) return "";

    return `
        <div class="attachments">
            ${attachments.map(att => {

                const media =
                    renderImageOrVideoAttachements(att);

                if (media) return media;

                return renderCommonAttachementLink(
                    att.url,
                    attachmentIcon(att.mime),
                    escapeHtml(att.original_name || att.url)
                );

            }).join("")}
        </div>
    `;
}

function add(msg) {
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `
        <div class="meta">
            <span class="sender" onclick="location.href='/chat?with=${msg.sender_id}'">${escapeHtml(msg.sender)}</span>
        </div>
        ${msg.text ? `<div class="text">${escapeHtml(msg.text)}</div>` : ""}
        ${renderAttachments(msg.attachments)}`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
    return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

// WebSocket
const proto = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${proto}://${location.host}/ws`);
ws.onopen  = () => { statusEl.textContent = "online"; };
ws.onclose = () => { statusEl.textContent = "offline"; };
ws.onerror = () => { statusEl.textContent = "error"; };
ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "history") { messagesEl.innerHTML = ""; data.messages.forEach(add); }
    if (data.type === "message") add(data.message);
};

// Загрузка файла
function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    event.target.value = "";
    files.forEach(uploadFile);
}

async function uploadFile(file) {
    const statusEl = document.getElementById("uploadStatus");
    statusEl.style.display = "block";
    statusEl.textContent = `Загрузка ${file.name}…`;

    const formData = new FormData();
    formData.append("file", file);

    const res = await apiFetch("/upload", { method: "POST", body: formData });
    if (!res || !res.ok) {
        const err = res ? (await res.json().catch(() => ({}))).detail : "ошибка сети";
        statusEl.textContent = `Ошибка: ${err || "не удалось загрузить"}`;
        setTimeout(() => { statusEl.style.display = "none"; }, 3000);
        return;
    }

    const data = await res.json();
    pendingAttachments.push({ url: data.url, mime: data.mime, original_name: data.original_name });
    renderPendingChips();
    statusEl.style.display = "none";
}

function renderPendingChips() {
    const el = document.getElementById("pendingFiles");
    el.innerHTML = pendingAttachments.map((a, i) => {
        const icon = attachmentIcon(a.mime);
        return `<div class="pending-chip">
            <span>${icon}</span>
            <span>${escapeHtml(a.original_name || a.url)}</span>
            <button class="remove" onclick="removePending(${i})">✕</button>
        </div>`;
    }).join("");
}

function removePending(idx) {
    pendingAttachments.splice(idx, 1);
    renderPendingChips();
}

// Отправка
async function send() {
    const text = input.value.trim();
    if (!text && pendingAttachments.length === 0) return;
    if (!ensureLoggedIn()) return;

    input.value = "";
    const attachments = [...pendingAttachments];
    pendingAttachments = [];
    renderPendingChips();

    const res = await apiFetch("/send_msg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, attachments }),
    });

    if (!res) {
        accessToken = null;
        ensureLoggedIn();
    }
}

input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("sendBtn").addEventListener("click", send);

(async () => { await refreshAccessToken(); })();
</script>
</body>
</html>
